<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blast Ranger</title>
<script src="vendor/matter.min.js"></script>
<style>
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800 900;font-display:swap;src:url(fonts/nunito-latin-var.woff2) format('woff2')}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#2a2140; --panel:#fff7e8; --panel-2:#ffe6bf;
  --accent:#ff6a3d; --accent-d:#c2441c; --teal:#17a99b; --teal-d:#0d7469;
  --chip:rgba(255,255,255,.93); --chip-ink:#2a2140; --shadow:rgba(42,33,64,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#2b2440; --panel-2:#3d335c; --ink:#fff1dc; --chip:rgba(38,31,58,.92); --chip-ink:#fff1dc; --shadow:rgba(0,0,0,.45); }
}
:root[data-theme="dark"]{ --panel:#2b2440; --panel-2:#3d335c; --ink:#fff1dc; --chip:rgba(38,31,58,.92); --chip-ink:#fff1dc; --shadow:rgba(0,0,0,.45); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:#8fd6e6;color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.disp{font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;letter-spacing:.4px;font-weight:400}
button{font:inherit}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 6px;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:7px 14px;font-size:17px;
  box-shadow:0 3px 0 var(--shadow);display:flex;align-items:center;gap:7px;white-space:nowrap}
.foe{width:12px;height:18px;position:relative;display:inline-block}
.foe::before{content:"";position:absolute;left:2px;top:0;width:8px;height:8px;border-radius:50%;background:#f06a3b}
.foe::after{content:"";position:absolute;left:1px;top:8px;width:10px;height:10px;border-radius:4px 4px 2px 2px;background:#f06a3b}
.ib{width:42px;height:42px;border:none;border-radius:14px;background:var(--chip);color:var(--chip-ink);
  box-shadow:0 4px 0 var(--shadow);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.ib svg{width:22px;height:22px}
.spacer{flex:1}
.wbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:12px;
  padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
.wbtn{pointer-events:auto;display:flex;align-items:center;gap:8px;border:none;border-radius:20px;
  padding:8px 16px 8px 8px;background:var(--chip);color:var(--chip-ink);box-shadow:0 5px 0 var(--shadow);
  font-size:16px;cursor:pointer;transition:transform .12s}
.wbtn .ic{width:40px;height:40px;border-radius:13px;background:var(--panel-2);display:grid;place-items:center}
.wbtn .ic svg{width:28px;height:28px}
.wbtn b{font-size:20px}
.wbtn.sel{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);transform:translateY(-3px)}
.wbtn.sel .ic{background:rgba(255,255,255,.28)}
.wbtn:disabled{opacity:.45;cursor:default}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(34,24,56,.35);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.card{background:var(--panel);color:var(--ink);border-radius:28px;padding:24px 22px;width:min(360px,100%);
  text-align:center;box-shadow:0 10px 0 var(--shadow);animation:pop .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.logo{font-size:60px;line-height:.88;margin:6px 0 12px}
.logo span{display:block}
.logo .a{color:var(--accent);text-shadow:0 5px 0 var(--accent-d)}
.logo .b{color:var(--teal);text-shadow:0 5px 0 var(--teal-d);transform:rotate(-3deg)}
.sub{font-weight:800;opacity:.75;margin:4px 0 20px;font-size:16px}
.btn{font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:22px;border:none;border-radius:18px;
  padding:13px 20px;background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--accent-d);cursor:pointer;width:100%}
.btn.alt{background:var(--teal);box-shadow:0 6px 0 var(--teal-d)}
.btn.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 6px 0 var(--shadow)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 18px}
.lv{aspect-ratio:1;border:none;border-radius:16px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);
  font-family:'Lilita One','Arial Rounded MT Bold',sans-serif;font-size:21px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.lv small{font-size:10px;letter-spacing:1px;color:#ffe08a;font-family:system-ui,sans-serif}
.lv.lock{background:var(--panel-2);color:var(--ink);box-shadow:0 5px 0 var(--shadow);opacity:.55;cursor:default}
.stars{font-size:48px;letter-spacing:4px;margin:4px 0}
.stars .on{color:#ffc93c;text-shadow:0 4px 0 #cf8a00}
.stars .off{color:var(--panel-2)}
h2{font-size:36px;margin:0 0 2px}
.muted{opacity:.7;font-weight:800;margin:0 0 18px}
.hint{position:fixed;left:50%;top:22%;z-index:4;pointer-events:none;background:rgba(42,33,64,.85);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:17px;white-space:nowrap;transform:translateX(-50%);animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
@media (prefers-reduced-motion: reduce){.hint,.card{animation:none}}
.hidden{display:none!important}
.hp{gap:8px;padding:7px 12px}
.hp svg{width:18px;height:18px;flex:none}
.bar{width:74px;height:10px;border-radius:6px;background:rgba(42,33,64,.18);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:6px;background:#3fc46a;transition:width .2s,background .2s}
.hp.shake{animation:hpshake .3s}
@keyframes hpshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.toggles{display:flex;justify-content:center;gap:6px}
.toggle{margin-top:2px;background:none;border:none;color:var(--ink);opacity:.75;font-weight:900;font-size:15px;cursor:pointer;padding:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <button class="ib" id="bMenu" aria-label="Levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

</div>

<div class="wbar" id="wbar">
  <button class="wbtn disp" id="wG"><span class="ic"><svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="4" rx="1" fill="#7a7f8c"/><path d="M15 4.5q5 .5 3.5 6" stroke="#7a7f8c" stroke-width="2" fill="none"/><ellipse cx="12" cy="14.5" rx="7" ry="8" fill="#4f9a3a"/><path d="M5.5 12h13M5.5 16.5h13M12 6.5v16" stroke="#2f6323" stroke-width="1.3"/><ellipse cx="9.5" cy="11.5" rx="1.8" ry="2.4" fill="#8fd16f"/></svg></span>Grenade <b>×0</b></button>
  <button class="wbtn disp" id="wR"><span class="ic"><svg viewBox="0 0 24 24"><g transform="rotate(-35 12 12)"><rect x="3" y="9" width="14" height="6" rx="2" fill="#4e7d3a"/><path d="M17 9L22.5 12 17 15z" fill="#e2402b"/><path d="M3 9L1 5.5 7 9zM3 15L1 18.5 7 15z" fill="#2f4d1d"/></g></svg></span>Rocket <b>×0</b></button>
</div>

<div class="hint disp hidden" id="hint"></div>

<div class="ov" id="ovTitle">
  <div class="card">
    <div class="logo disp"><span class="a">Blast</span><span class="b">Ranger</span></div>
    <p class="sub">Topple towers, outlast knights and archers, and bend your shots through portals and black holes.</p>
    <div class="stack">
      <button class="btn" id="tPlay">Play</button>
      <button class="btn ghost" id="tLevels">Choose level</button>
      <div class="toggles"><button class="toggle" id="tMusic">Music: on</button><button class="toggle" id="tBlood">Blood: on</button></div>
    </div>
  </div>
</div>

<div class="ov hidden" id="ovLevels">
  <div class="card">
    <h2 class="disp">Levels</h2>
    <div class="grid" id="grid"></div>
    <button class="btn ghost" id="lBack">Back</button>
  </div>
</div>

<div class="ov hidden" id="ovResult">
  <div class="card" id="resCard"></div>
</div>

const rnd=(a,b)=>a+Math.random()*(b-a);
function rot(v,a){const c=Math.cos(a),s=Math.sin(a);return{x:v.x*c-v.y*s,y:v.x*s+v.y*c};}
function normA(a){a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI;}
function wpt(b,l){const r=rot(l,b.angle);return{x:b.position.x+r.x,y:b.position.y+r.y};}
function add(b){Composite.add(world,b);return b;}
function later(steps,fn){queue.push({at:sim+steps,fn});}
function inWorld(b){return !!Composite.get(world,b.id,'body');}
function alerted(){return shots>0||sim>(LEVELS[levelIdx].alertAt||240);}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
function segX(a,b,c,d){const r=(b.x-a.x)*(d.y-c.y)-(b.y-a.y)*(d.x-c.x); if(!r) return false;
  const t=((c.x-a.x)*(d.y-c.y)-(c.y-a.y)*(d.x-c.x))/r, u=((c.x-a.x)*(b.y-a.y)-(c.y-a.y)*(b.x-a.x))/r; return t>=0&&t<=1&&u>=0&&u<=1;}
function cracks(x0,y0,w,h,n){
  const out=[];
  for(let i=0;i<n;i++){
    let x=x0+Math.random()*w, y=y0+Math.random()*h, a=Math.random()*Math.PI*2; const pts=[[x,y]];
    const k=3+(Math.random()*3|0);
    for(let j=0;j<k;j++){a+=rnd(-1.1,1.1); const L=rnd(7,20); x+=Math.cos(a)*L; y+=Math.sin(a)*L; pts.push([x,y]);}
    out.push(pts);
  }
  return out;
}

function addBlock(x,y,w,h,mat,angle){
  const m=MAT[mat];
  const b=Bodies.rectangle(x,y,w,h,{angle:angle||0,density:m.density,friction:m.friction,frictionStatic:m.fs,restitution:m.rest,
    plugin:{kind:'block',mat,w,h,hp:m.hp,cr:mat==='sand'?cracks(-w/2,-h/2,w,h,Math.max(1,Math.round(w*h/900))):null}});
  return add(b);
}
function makeChar(x,bot,type){
  const feet=Bodies.rectangle(x,bot-4,30,8,{density:.004});
  let parts,torso,head,extra=null;
  if(type==='player'){torso=Bodies.rectangle(x,bot-42,26,32);head=Bodies.circle(x,bot-70,13);parts=[feet,Bodies.rectangle(x,bot-17,20,18),torso,head];}
  else{torso=Bodies.rectangle(x,bot-28,24,40);head=Bodies.circle(x,bot-61,13);parts=[feet,torso,head];}
  if(type==='knight'){extra=Bodies.rectangle(x-20,bot-34,8,46,{density:.002});parts.push(extra);}
  if(type==='jet'){extra=Bodies.rectangle(x+17,bot-32,12,24,{density:.002});parts.push(extra);}
  const e=Body.create({parts,friction:.9,frictionStatic:1,restitution:0,plugin:{kind:type==='player'?'player':'enemy',alive:true}});
  const P={x:e.position.x,y:e.position.y}, L=o=>({x:o.position.x-P.x,y:o.position.y-P.y});
  e.plugin.loc={feet:L(feet),torso:L(torso),head:L(head),ref:{x:x-P.x,y:bot-28-P.y},extra:extra?L(extra):null};
  if(extra) extra.plugin={part:type==='knight'?'shield':'pack'};
  return add(e);
}
function makeTitan(x,bot){

  const e=Body.create({parts:[feet,legs,torso,head,core],friction:.35,frictionStatic:1,restitution:0,plugin:{kind:'enemy',alive:true}});
  const P={x:e.position.x,y:e.position.y},L=o=>({x:o.position.x-P.x,y:o.position.y-P.y});
  e.plugin.loc={feet:L(feet),legs:L(legs),torso:L(torso),head:L(head),core:L(core),ref:{x:x-P.x,y:bot-62-P.y},extra:null};
  core.plugin={part:'core'};

}
function makeDragon(x,y){
  const bd=Bodies.rectangle(x,y,92,38,{density:.0012});
  const head=Bodies.circle(x-74,y-30,18,{density:.0012});
  const tail=Bodies.rectangle(x+70,y+6,52,12,{density:.0008});

  const P={x:e.position.x,y:e.position.y},L=o=>({x:o.position.x-P.x,y:o.position.y-P.y});

  head.plugin={part:'head'};

}
function addRope(c,kind){Composite.add(world,c); const r={c,kind,cut:false}; ropes.push(r); return r;}
function ropeEnds(r){const c=r.c;
  const A=c.bodyA?{x:c.bodyA.position.x+c.pointA.x,y:c.bodyA.position.y+c.pointA.y}:{x:c.pointA.x,y:c.pointA.y};
  const B=c.bodyB?{x:c.bodyB.position.x+c.pointB.x,y:c.bodyB.position.y+c.pointB.y}:{x:c.pointB.x,y:c.pointB.y};
  return [A,B];}
function makeBuilder(){
  return {
    ground(x1,x2,top){add(Bodies.rectangle((x1+x2)/2,top+1000,x2-x1,2000,{isStatic:true,friction:.9,
      plugin:{kind:'ground',cr:cracks(x1,top+8,x2-x1,360,Math.round((x2-x1)*360/5000))}}));},
    plat(x1,x2,top,th=34){add(Bodies.rectangle((x1+x2)/2,top+th/2,x2-x1,th,{isStatic:true,friction:.9,
      plugin:{kind:'plat',cr:cracks(x1,top+4,x2-x1,th-6,Math.round((x2-x1)/25))}}));},
    wall(x1,y1,x2,y2){add(Bodies.rectangle((x1+x2)/2,(y1+y2)/2,x2-x1,y2-y1,{isStatic:true,friction:.9,
      plugin:{kind:'plat',cr:cracks(x1,y1+4,x2-x1,y2-y1-4,Math.round((x2-x1)*(y2-y1)/1500))}}));},
    pad(x1,y1,x2,y2){add(Bodies.rectangle((x1+x2)/2,(y1+y2)/2,x2-x1,y2-y1,{isStatic:true,friction:.2,restitution:1,plugin:{kind:'pad',w:x2-x1,h:y2-y1}}));},
    slope(x1,y1,x2,y2,th=40){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
      add(Bodies.rectangle((x1+x2)/2+nx*th/2,(y1+y2)/2+ny*th/2,L,th,{isStatic:true,angle:Math.atan2(dy,dx),friction:.9,plugin:{kind:'plat',cr:[]}}));},
    block(cx,bottom,w,h,mat){return addBlock(cx,bottom-h/2,w,h,mat,0);},
    enemy(x,bottom,o){
      o=o||{}; const type=o.knight?'knight':o.jet?'jet':'enemy';
      const e=o.titan?makeTitan(x,bottom):o.dragon?makeDragon(x,bottom):makeChar(x,bottom,type);
      e.collisionFilter.category=4;
      Object.assign(e.plugin,{shooter:!!o.shooter,archer:!!o.archer,knight:!!o.knight,jet:!!o.jet,titan:!!o.titan,dragon:!!o.dragon,aimA:Math.PI});
      if(o.knight){Body.setInertia(e,e.inertia*4);}
      if(o.titan){Body.setInertia(e,e.inertia*10);}
      if(o.dragon){Body.setInertia(e,e.inertia*6);e.plugin.hx=e.position.x;e.plugin.hy=e.position.y;e.plugin.ph=Math.random()*6;e.plugin.breath='idle';}
      if(o.jet){e.plugin.hx=e.position.x;e.plugin.hy=e.position.y;e.plugin.ph=Math.random()*6;}
      enemies.push(e); return e;},
    boulder(cx,bottom,r){return add(Bodies.circle(cx,bottom-r,r,{density:.0022,friction:.9,frictionAir:.001,restitution:.05,plugin:{kind:'boulder',r}}));},
    barrel(cx,bottom){return add(Bodies.rectangle(cx,bottom-21,30,42,{density:.0012,friction:.6,plugin:{kind:'barrel'}}));},
    hang(anchor,body,local){
      const p=wpt(body,local), len=Math.hypot(p.x-anchor[0],p.y-anchor[1]);
      addRope(Constraint.create({pointA:{x:anchor[0],y:anchor[1]},bodyB:body,pointB:local,length:len,stiffness:.95,damping:.05}),'rope');},
    tether(anchor,body,local){
      const p=wpt(body,local), len=Math.hypot(p.x-anchor[0],p.y-anchor[1]);
      addRope(Constraint.create({pointA:{x:anchor[0],y:anchor[1]},bodyB:body,pointB:local,length:len,stiffness:.6,damping:.1}),'rope');},
    balloon(x,y,body,local,lift){
      const cols=['#ff5a6e','#ffc93c','#4fb8ff','#b07cff','#5ee08a'];
      const bl=add(Bodies.circle(x,y,22,{density:.0003,frictionAir:.04,restitution:.3,collisionFilter:{group:0,category:8,mask:0xFFFFFFFF},plugin:{kind:'balloon',lift,col:cols[balloons.length%cols.length]}}));
      balloons.push(bl);
      const p=wpt(body,local), q={x,y:y+22}, len=Math.hypot(p.x-q.x,p.y-q.y);
      const r=addRope(Constraint.create({bodyA:bl,pointA:{x:0,y:22},bodyB:body,pointB:local,length:len,stiffness:.9,damping:.05}),'rope');
      bl.plugin.rope=r; return bl;},
    bridge(x1,y1,x2,y2,n){
      const L=(x2-x1)/n, planks=[];
      for(let i=0;i<n;i++){const pk=addBlock(x1+L*(i+.5),y1+(y2-y1)*(i+.5)/n+5,L-3,10,'wood',0); pk.plugin.plank=true; planks.push(pk);}
      addRope(Constraint.create({pointA:{x:x1,y:y1+5},bodyB:planks[0],pointB:{x:-L/2+1.5,y:0},length:2,stiffness:.9}),'link');
      for(let i=0;i<n-1;i++) addRope(Constraint.create({bodyA:planks[i],pointA:{x:L/2-1.5,y:0},bodyB:planks[i+1],pointB:{x:-L/2+1.5,y:0},length:3,stiffness:.9}),'link');
      addRope(Constraint.create({pointA:{x:x2,y:y2+5},bodyB:planks[n-1],pointB:{x:L/2-1.5,y:0},length:2,stiffness:.9}),'link');
      return planks;}
  };

function build(i){
  levelIdx=i; const L=LEVELS[i]; theme=L.theme||'desert';
  engine=Engine.create({positionIterations:10,velocityIterations:8,constraintIterations:4}); world=engine.world;
  flames=[];enemies=[];projectiles=[];bullets=[];arrows=[];nades=[];rags=[];queue=[];particles=[];decals=[];portals=[];ropes=[];balloons=[];stuck=[];
  wells=(L.wells||[]).map(w=>({x:w[0],y:w[1],s:w[2]||.2,R:240}));
  sim=0;shots=0;lastShot=-9999;lastMove=0;shake=0;slowUntil=0;recoil=0;flashA=0;hurtA=0;loseWhy='ammo';
  genClouds();
  L.build(makeBuilder());
  add(Bodies.rectangle(-300,1560,600,2000,{isStatic:true,friction:.9,plugin:{kind:'ground',cr:[]}}));   // solid ground behind the player
  const pp=Object.assign({x:100,y:560},L.player||{});
  player=makeChar(pp.x,pp.y,'player'); Object.assign(player.plugin,{hp:100,hitCd:0,flash:0,cause:''});
  Body.setInertia(player,Infinity);   // the soldier braces himself: he can be shoved or blown away, but never tips over by himself
  playerGroup=Body.nextGroup(true); player.collisionFilter.group=playerGroup;
  (L.portals||[]).forEach((pd,pi)=>{
    const A={pair:pi,x0:pd.a[0],y0:pd.a[1],x:pd.a[0],y:pd.a[1],mv:pd.move&&pd.move.end==='a'?pd.move:null};
    const B={pair:pi,x0:pd.b[0],y0:pd.b[1],x:pd.b[0],y:pd.b[1],mv:pd.move&&pd.move.end==='b'?pd.move:null};
    A.partner=B; B.partner=A; portals.push(A,B);
  });
  statics=Composite.allBodies(world).filter(b=>b.isStatic);
  ammo=Object.assign({grenade:0,rocket:0},L.ammo);
  weapon=ammo.grenade>0?'grenade':'rocket';
  Events.on(engine,'collisionStart',onCollide);
  Events.on(engine,'beforeUpdate',beforeUpd);
  settling=true; for(let k=0;k<80;k++) Engine.update(engine,DT); settling=false;
  for(const b of Composite.allBodies(world)) if(!b.isStatic&&b.plugin.kind!=='balloon'){Body.setVelocity(b,{x:0,y:0});Body.setAngularVelocity(b,0);}
  queue=[];
  aim={dx:.8,dy:-.6,pow:.55,active:false}; drag=null;
  updateHUD();
}

function wellAcc(x,y){
  let ax=0,ay=0;
  for(const w of wells){const dx=w.x-x,dy=w.y-y,r=Math.hypot(dx,dy); if(r>w.R||r<1) continue; const a=Math.min(.7,w.s*(100/r)*(100/r)); ax+=dx/r*a; ay+=dy/r*a;}
  return{x:ax,y:ay};
}
function beforeUpd(){
  const k=1/(DT*DT);
  for(const p of projectiles) if(p.plugin.kind==='rocket') p.force.y-=p.mass*0.001*0.8;
  for(const b of bullets) b.force.y-=b.mass*0.001;
  for(const b of balloons) b.force.y-=b.plugin.lift*0.001;
  for(const f of flames) f.force.y-=f.mass*0.001*.85;
  if(wells.length) for(const b of Composite.allBodies(world)){
    if(b.isStatic||b===player) continue;
    const a=wellAcc(b.position.x,b.position.y); if(!a.x&&!a.y) continue;
    b.force.x+=b.mass*a.x*k; b.force.y+=b.mass*a.y*k;
  }
  const chars=player&&player.plugin.alive?enemies.concat([player]):enemies;
  for(const e of chars){
    if(!e.plugin.alive||e===player) continue;
    const a=normA(e.angle);
    if(e.plugin.titan){ if(Math.abs(a)<1.3) Body.setAngularVelocity(e,e.angularVelocity*.7-a*.1); continue; }
    if(e.plugin.jet||e.plugin.dragon){
      // hover with thrust / wing beats: cancel gravity, steer toward the hover point, stay upright
      const dr=e.plugin.dragon, t=sim/60+e.plugin.ph, calm=dr&&e.plugin.breath!=='idle'?.35:1;
      const tx=e.plugin.hx+Math.sin(t*(dr?.45:.7))*(dr?70:40)*calm, ty=e.plugin.hy+Math.sin(t*(dr?.9:1.3))*(dr?26:14)*calm+(dr?Math.sin(sim*.18)*3:0);
      let ax=(tx-e.position.x)*.0016-e.velocity.x*.06, ay=(ty-e.position.y)*.0016-e.velocity.y*.06;
      const m=Math.hypot(ax,ay); if(m>.35){ax*=.35/m;ay*=.35/m;}
      if(Math.abs(a)<.9){e.force.x+=e.mass*ax*k; e.force.y+=e.mass*ay*k-e.mass*.001;}
      if(Math.abs(a)<.9) Body.setAngularVelocity(e,e.angularVelocity*.8-a*.05);
      continue;
    }
    const lim=e.plugin.knight?.6:.45;
    if(Math.abs(a)<lim&&Math.abs(e.angularVelocity)<.1) Body.setAngularVelocity(e,e.angularVelocity*.75-a*(e.plugin.knight?.06:.03));
  }
}
function onCollide(ev){
  for(const pr of ev.pairs){const A=pr.bodyA.parent,B=pr.bodyB.parent; hit(A,B,pr.bodyA,pr.bodyB); hit(B,A,pr.bodyB,pr.bodyA);}
}
function hit(A,B,pa,pb){
  const k=A.plugin.kind;
  if(k==='rocket'){
    if(!A.plugin.done){A.plugin.done=true; later(0,()=>{removeProj(A); explode(A.position,R_ROCK,P_ROCK,A,'self');});}
    return;
  }
  if(k==='bullet'||k==='arrow'){
    if(!A.plugin.done){A.plugin.done=true; const shield=pb.plugin&&pb.plugin.part==='shield'; later(0,()=>missileHit(A,B,shield));}
    return;
  }
  if(k==='flame'){
    if(!A.plugin.done&&!settling){
      if(B.plugin.kind==='player'){A.plugin.done=true; later(0,()=>flameHit(A,B));}
      else if(B.isStatic||['block','boulder','barrel'].includes(B.plugin.kind)){A.plugin.done=true; later(0,()=>fizzle(A,B));}
    }
    return;
  }
  if(k==='balloon'){
    const rv=Math.hypot(A.velocity.x-B.velocity.x,A.velocity.y-B.velocity.y);
    if(!settling&&(rv>3||['grenade','bullet','arrow','nade'].includes(B.plugin.kind))) later(0,()=>popBalloon(A));
    return;
  }
  if(settling) return;
  const bk=B.plugin.kind;
  if(bk==='bullet'||bk==='arrow'||bk==='balloon'||bk==='flame') return;
  const rv=Math.hypot(A.velocity.x-B.velocity.x,A.velocity.y-B.velocity.y);
  if(k==='grenade'||k==='nade'){ if(rv>3) sfx('clink',Math.min(1,rv/12)); return; }
  if(k==='enemy'&&A.plugin.alive&&!A.plugin.dying&&!A.plugin.titan&&!A.plugin.dragon){
    let deadly=false;
    if(B.isStatic) deadly=rv>(A.plugin.knight?9.5:7.5);
    else { const ratio=Math.min(B.mass/A.mass,4); deadly=rv*ratio>(A.plugin.knight?9:6.5) && !(bk==='rag'&&rv<9) && !(bk==='enemy'); }
    if(deadly){
      A.plugin.dying=true;
      const bv={x:B.velocity.x*.4,y:B.velocity.y*.4}, crush=rv*Math.min(B.mass/A.mass,4)>16;
      later(0,()=>kill(A,bv,crush));
    }
  }
  if(k==='player'&&A.plugin.alive&&sim>A.plugin.hitCd&&bk!=='enemy'){
    let dmg=0;
    if(B.isStatic){ if(rv>9) dmg=(rv-7)*8; }
    else if(B.mass>A.mass*.4){ const s=rv*Math.min(B.mass/A.mass,4); if(s>6) dmg=(s-5)*6; }
    if(dmg>0){ A.plugin.hitCd=sim+12; const bv={x:B.velocity.x-A.velocity.x,y:B.velocity.y-A.velocity.y}; later(0,()=>damagePlayer(dmg,bv,null,B.isStatic?'fall':'crush')); }
  }
  if(k==='barrel'&&!A.plugin.triggered&&rv>7) trigger(A);
}
function trigger(b){
  b.plugin.triggered=true;
  later(7,()=>{ if(inWorld(b)) explode({x:b.position.x,y:b.position.y},R_BAR,P_BAR,b,'barrel'); });
}
function popBalloon(bl){
  if(!inWorld(bl)) return;
  Composite.remove(world,bl); balloons=balloons.filter(x=>x!==bl);
  if(bl.plugin.rope) cutRope(bl.plugin.rope,true);
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=rnd(80,260);particles.push({t:'chunk',x:bl.position.x,y:bl.position.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,s:rnd(3,6),c:bl.plugin.col,g:600,life:0,max:rnd(.5,.9),spin:rnd(-10,10),drag:2});}
  particles.push({t:'ring',x:bl.position.x,y:bl.position.y,vx:0,vy:0,r:40,life:0,max:.2});
  sfx('balloon');
}
function cutRope(r,quiet){
  if(r.cut) return; r.cut=true; Composite.remove(world,r.c);
  const [A,B]=ropeEnds(r);
  if(!quiet){ for(let i=0;i<6;i++) particles.push({t:'chunk',x:(A.x+B.x)/2,y:(A.y+B.y)/2,vx:rnd(-120,120),vy:rnd(-200,0),s:rnd(2,4),c:'#8a6a40',g:1100,life:0,max:.6}); sfx('snap'); }
  r.fa=A; r.fb=B; r.t0=sim;
}

/* ---------------- CHARACTERS ---------------- */
function charColors(e){return e.plugin.kind==='player'?['#3b6cff','#2a4fd0','#8fb0ff']:e.plugin.titan?['#8b86a8','#5a5770','#b8b4d4']:e.plugin.dragon?['#3fa34d','#2b7a37','#9fdc6b']:['#f06a3b','#c24a20','#ffa27a'];}
function makeRagdoll(e,ev,gib,S){
  S=S||1;
  const a=e.angle, T=wpt(e,e.plugin.loc.ref), col=charColors(e);
  let vx=e.velocity.x+(ev?ev.x:0), vy=e.velocity.y+(ev?ev.y:0);
  const vm=Math.hypot(vx,vy); if(vm>22){vx*=22/vm;vy*=22/vm;}
  const w0=isFinite(e.angularVelocity)?e.angularVelocity:0;
  const ex=e.plugin.loc.extra?wpt(e,e.plugin.loc.extra):null;
  Composite.remove(world,e);
  const grp=Body.nextGroup(true);
  const P=(lx,ly)=>{const r=rot({x:lx*S,y:ly*S},a);return{x:T.x+r.x,y:T.y+r.y};};
  const bleedTo=sim+(gib?110:40);
  const opt=(shape,w,h)=>({angle:a,collisionFilter:{group:grp,category:1,mask:0xFFFFFFFF},friction:.8,frictionAir:.012,density:.0012,restitution:.1,plugin:{kind:'rag',shape,w:w*S,h:h*S,col,bleed:bleedTo,r:13*S}});
  const tL={x:0,y:-3}, tP=P(0,-3);
  const torso=Bodies.rectangle(tP.x,tP.y,22*S,34*S,opt('torso',22,34));
  const hP=P(0,-33); const head=Bodies.circle(hP.x,hP.y,13*S,opt('head',26,26));
  const parts=[torso,head], cons=[];
  const join=(B2,bL,j)=>{
    if(gib) return;
    cons.push(Constraint.create({bodyA:torso,pointA:rot({x:j.x-tL.x,y:j.y-tL.y},a),bodyB:B2,pointB:rot({x:j.x-bL.x,y:j.y-bL.y},a),length:0,stiffness:.7,damping:.1}));
  };
  join(head,{x:0,y:-33},{x:0,y:-20});
  for(const d of [[-13,-3,8,22,-13,-14],[13,-3,8,22,13,-14],[-6,20,9,16,-6,12],[6,20,9,16,6,12]]){
    const p=P(d[0],d[1]); const limb=Bodies.rectangle(p.x,p.y,d[2]*S,d[3]*S,opt('limb',d[2],d[3]));
    parts.push(limb); join(limb,{x:d[0],y:d[1]},{x:d[4],y:d[5]});
  }
  Composite.add(world,parts); if(cons.length) Composite.add(world,cons);
  for(const p of parts){
    let sx=rnd(-1,1),sy=rnd(-1,1);
    if(gib){const dx=p.position.x-T.x,dy=p.position.y-T.y,dl=Math.hypot(dx,dy)||1; sx=dx/dl*rnd(3,7)+rnd(-2,2); sy=dy/dl*rnd(3,7)-rnd(1,4);}
    Body.setVelocity(p,{x:vx+sx,y:vy+sy}); Body.setAngularVelocity(p,w0+rnd(-.15,.15)*(gib?3:1));
  }
  rags.push(...parts);
  // knights drop their shield and sword as real objects
  if(e.plugin.knight&&ex){
    const sh=addBlock(ex.x,ex.y,8,46,'wood',a); sh.plugin.look='shield'; Body.setVelocity(sh,{x:vx+rnd(-2,2),y:vy-rnd(1,3)}); Body.setAngularVelocity(sh,rnd(-.2,.2));
    const sw=addBlock(T.x+14,T.y-10,4,36,'stone',a+.5); sw.plugin.look='sword'; sw.plugin.hp=1e9; Body.setVelocity(sw,{x:vx+rnd(-3,3),y:vy-rnd(2,5)}); Body.setAngularVelocity(sw,rnd(-.4,.4));
  }
  const dl=Math.hypot(vx,vy)||1;
  bloodBurst(T.x,T.y-8,vx/dl,vy/dl,gib?55:22,gib?1.6:1,col);
  if(gib) particles.push({t:'ring',x:T.x,y:T.y,vx:0,vy:0,r:45,life:0,max:.25,c:prog.blood?'#c21a2a':'#fff'});
  return T;
}
function kill(e,ev,gib){
  if(!e.plugin.alive) return; e.plugin.alive=false;
  const T=makeRagdoll(e,ev,gib);
  if(e.plugin.jet){ // the jetpack's fuel tank goes up a moment later
    const v={x:e.velocity.x,y:e.velocity.y};
    later(14,()=>explode({x:T.x+v.x*14,y:T.y+v.y*14},80,20,null,'enemy'));
  }
  sfx(gib?'splat':'pop');
  updateHUD();
}

}

function flameHit(f,B){
  flames=flames.filter(x=>x!==f); if(inWorld(f)) Composite.remove(world,f);
  if(B.plugin.alive&&sim>=(B.plugin.fireCd||0)){ B.plugin.fireCd=sim+9; const v=f.velocity; damagePlayer(5,{x:v.x,y:v.y},{x:f.position.x,y:f.position.y},'fire');
    for(let i=0;i<5;i++) particles.push({t:'fire',x:f.position.x,y:f.position.y,vx:rnd(-60,60),vy:rnd(-120,-20),r:rnd(4,8),life:0,max:.35}); }
}
function fizzle(f,B){
  flames=flames.filter(x=>x!==f); if(inWorld(f)) Composite.remove(world,f);
  for(let i=0;i<3;i++) particles.push({t:'smoke',x:f.position.x,y:f.position.y,vx:rnd(-30,30),vy:rnd(-60,-10),r:rnd(5,9),life:0,max:rnd(.5,.9)});
  if(B.plugin.kind==='barrel'&&!B.plugin.triggered) trigger(B);
  if(Math.random()<.25) addDecal({t:'scorch',x:f.position.x,y:f.position.y,r:rnd(14,22)});
}
const CAUSES={
  self:['Caught in your own blast','Blasts hurt you too. Aim farther from yourself.'],
  enemy:['Blown up','Hit jetpack troopers before they get a throw off.'],
  barrel:['A barrel went off too close','Keep barrels at a distance before you set them off.'],
  bullet:['Shot down','Take out the green helmets first.'],
  arrow:['Hit by arrows','Archers shoot over cover. Get them early.'],
  sword:['Cut down by a knight','Lob grenades on top of knights before they reach you.'],
  crush:['Crushed','Watch out for heavy things flying your way.'],
  fall:['You fell','Explosions can push you off the edge.'],
  fire:['Burned by dragon fire','Lob a grenade into the dragon\'s mouth while it\'s open.'],
  titan:['Smashed by a titan','Only a hit to the glowing belly stops a titan.']
};
function damagePlayer(dmg,dir,at,cause){
  if(!player.plugin.alive||state!=='play'&&state!=='won') return;
  dmg=Math.round(dmg); if(dmg<1) return;
  player.plugin.hp=Math.max(0,player.plugin.hp-dmg); if(cause!=='fall'||sim-(player.plugin.dmgAt||-999)>120) player.plugin.cause=cause||'crush'; player.plugin.dmgAt=sim;
  player.plugin.flash=sim+8; hurtA=Math.min(.75,hurtA+.25+dmg/120);
  const T=at||wpt(player,player.plugin.loc.torso);
  const dl=Math.hypot(dir.x,dir.y)||1;
  bloodBurst(T.x,T.y,dir.x/dl,dir.y/dl,6+dmg/3,1,charColors(player));
  particles.push({t:'text',x:T.x,y:T.y-40,vx:rnd(-20,20),vy:-90,life:0,max:.9,text:'-'+dmg,c:'#ff3b4e'});
  const chip=$('hpChip'); chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake');
  sfx('hurt'); musicDuck();
  if(player.plugin.hp<=0) killPlayer({x:dir.x/dl*6,y:dir.y/dl*6},dmg>45);
  updateHUD();
}
function killPlayer(ev,gib){
  if(!player.plugin.alive) return;
  player.plugin.alive=false; player.plugin.hp=0;
  makeRagdoll(player,ev,gib); sfx(gib?'splat':'pop');
  hurtA=.8;
  if(state==='play'){state='lost'; loseWhy='ko'; slowUntil=performance.now()+900; setTimeout(showLose,1500);}
  updateHUD();
}

/* ---------------- EXPLOSIONS, BULLETS, ARROWS ---------------- */
function explode(p0,R,power,src,cause){
  const p={x:p0.x,y:p0.y};
  if(src&&inWorld(src)) Composite.remove(world,src);
  fxExplosion(p,R,power); shake=Math.min(20,shake+power*.45); sfx('boom',power/40); musicDuck();
  if(power>=P_BAR) flashA=Math.max(flashA,.35);
  for(const r of ropes) if(!r.cut){const [A,B]=ropeEnds(r); if(segDist(p,A,B)<R*.4) cutRope(r);}
  const all=Composite.allBodies(world);
  const blockers=all.filter(b=>b.isStatic||(b.plugin.kind==='block'&&b.plugin.mat==='stone'));
  for(const b of all){
    if(b.isStatic) continue;
    const k=b.plugin.kind;
    const cx=Math.max(b.bounds.min.x,Math.min(p.x,b.bounds.max.x)), cy=Math.max(b.bounds.min.y,Math.min(p.y,b.bounds.max.y));
    const d=Math.hypot(cx-p.x,cy-p.y); if(d>R) continue;
    let f=1-d/R;
    let dx=b.position.x-p.x, dy=b.position.y-p.y; const dl=Math.hypot(dx,dy)||1; dx/=dl; dy=dy/dl-.35;
    const nl=Math.hypot(dx,dy)||1; dx/=nl; dy/=nl;
    if(d>4){const bl=blockers.filter(x=>x!==b); if(bl.length&&Query.ray(bl,p,b.position).length) f*=.35;}
    // a knight's shield soaks up blasts that come from in front of him
    if(k==='enemy'&&b.plugin.knight){const sh=wpt(b,b.plugin.loc.extra); if(p.x<sh.x+4&&p.y>b.position.y-48) f*=.15;}
    if(k==='enemy'&&b.plugin.titan&&b.plugin.alive){
      const c=wpt(b,b.plugin.loc.core);
      if(Math.hypot(c.x-p.x,c.y-p.y)<40){killTitan(b,{x:dx*8,y:dy*8});continue;}
      if(f>.3){particles.push({t:'text',x:p.x,y:p.y-30,vx:0,vy:-70,life:0,max:.8,text:'ARMOR',c:'#cfd5dc'}); sfx('clang');}
      f*=.12;
    }
    if(k==='enemy'&&b.plugin.dragon&&b.plugin.alive){
      const m=wpt(b,b.plugin.loc.mouth);
      if(b.plugin.mouthOpen&&Math.hypot(m.x-p.x,m.y-p.y)<32){killDragon(b);continue;}
      if(f>.3){particles.push({t:'text',x:p.x,y:p.y-30,vx:0,vy:-70,life:0,max:.8,text:'SCALES',c:'#9fdc6b'});}
      f*=.15;
    }
    const J=Math.min(power*f,20*b.mass);
    const dv={x:dx*J/b.mass,y:dy*J/b.mass};
    if(k==='enemy'){ if(b.plugin.alive&&f>.18&&!b.plugin.titan&&!b.plugin.dragon){kill(b,dv,f>.62);continue;} }
    else if(k==='player'){
      if(b.plugin.alive&&f>.05){
        const dmg=power*f*(cause==='enemy'?1.3:1.9);
        const dying=player.plugin.hp-dmg<=0;
        damagePlayer(dmg,dv,null,cause||'self');
        if(dying) continue;
      }
    }
    else if(k==='balloon'){ later(0,()=>popBalloon(b)); continue; }
    else if(k==='barrel'){ if(!b.plugin.triggered&&f>.1) trigger(b); }
    else if(k==='block'){ if(power*f>b.plugin.hp){shatter(b,dv);continue;} }
    else if(k==='rag'&&f>.4){ b.plugin.bleed=Math.max(b.plugin.bleed,sim+30); }
    Body.applyForce(b,{x:cx,y:cy},{x:dx*J/(DT*DT),y:dy*J/(DT*DT)});
  }
}
function shatter(b,dv){
  const {w,h,mat}=b.plugin, m=MAT[mat];
  Composite.remove(world,b);
  for(const r of ropes) if(!r.cut&&(r.c.bodyA===b||r.c.bodyB===b)) cutRope(r,true);
  const col=mat==='ice'?'#d9f3ff':m.fill;
  for(let i=0;i<12;i++) particles.push({t:'chunk',x:b.position.x+rnd(-w/3,w/3),y:b.position.y+rnd(-h/3,h/3),vx:dv.x*40+rnd(-220,220),vy:dv.y*40+rnd(-380,-50),s:rnd(3,7),c:col,g:1300,life:0,max:rnd(.6,1.1),spin:rnd(-12,12)});
  if(mat==='wood') for(let i=0;i<6;i++) particles.push({t:'splinter',x:b.position.x,y:b.position.y,vx:dv.x*50+rnd(-260,260),vy:dv.y*50+rnd(-400,-80),s:rnd(8,14),c:m.dark,g:1300,life:0,max:rnd(.6,1),spin:rnd(-15,15)});
  const cols=w>=34?2:1, rows=h>=34?2:1;
  if(cols*rows===1) return;
  const vm=Math.hypot(dv.x,dv.y), sc=vm>18?18/vm:1;
  const pw=w/cols, ph=h/rows;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const r=rot({x:-w/2+pw*(i+.5),y:-h/2+ph*(j+.5)},b.angle);
    const nb=addBlock(b.position.x+r.x,b.position.y+r.y,pw-1.5,ph-1.5,mat,b.angle);
    nb.plugin.hp=m.hp*.6;
    Body.setVelocity(nb,{x:b.velocity.x+dv.x*sc*.8+rnd(-1.5,1.5),y:b.velocity.y+dv.y*sc*.8+rnd(-1.5,1)});
    Body.setAngularVelocity(nb,rnd(-.2,.2));
  }
}
function missileHit(ms,B,shield){

// find a launch angle that lands a lobbed shot on the target, using the exact same step physics as the engine
function solveLob(S,T,speed,g,preferHigh){
  const dirX=Math.sign(T.x-S.x)||-1; let low=null, high=null;
  for(let deg=-20;deg<=82;deg+=2){
    const a=deg*Math.PI/180; let x=S.x,y=S.y,vx=Math.cos(a)*speed*dirX,vy=-Math.sin(a)*speed,best=1e9;
    for(let i=0;i<240;i++){
      const wa=wells.length?wellAcc(x,y):{x:0,y:0};
      vx+=wa.x; vy+=g+wa.y; x+=vx; y+=vy;
      const d=Math.hypot(x-T.x,y-T.y); if(d<best) best=d;
      if(y>T.y+60&&vy>0) break;
    }
    const c={a:Math.atan2(-Math.sin(a),Math.cos(a)*dirX),miss:best,deg};
    if(deg<38){if(!low||best<low.miss) low=c;} else {if(!high||best<high.miss) high=c;}
  }
  const ok=c=>c&&c.miss<26;
  const r=preferHigh?(ok(high)?high:ok(low)?low:null):(ok(low)?low:ok(high)?high:null);
  if(r) r.speed=speed; return r;
}
function solveAny(S,T,speeds,g,preferHigh){for(const sp of speeds){const r=solveLob(S,T,sp,g,preferHigh); if(r) return r;} return null;}

}

/* ---------------- PORTALS, ROPES, WELLS ---------------- */
function inPortal(e,p){const dx=(p.x-e.x)/24,dy=(p.y-e.y)/36;return dx*dx+dy*dy<1;}
function portalAt(p){for(const e of portals) if(inPortal(e,p)) return e; return null;}
function movers(){return projectiles.concat(bullets,arrows,nades,flames);}
function updateWorldTricks(){
  const t=sim*DT/1000;
  for(const e of portals) if(e.mv){e.y=e.y0+Math.sin(t*e.mv.spd)*e.mv.amp;}
  const mv=movers();

    if(e&&e!==b.plugin.inP){

      Body.setPosition(b,{x:o.x,y:o.y}); Body.setVelocity(b,v);
      b.plugin.inP=o; b.plugin.px=o.x; b.plugin.py=o.y; fxPortal(e); fxPortal(o); sfx('warp');
    } else if(!e) b.plugin.inP=null;

    const p0={x:b.plugin.px??b.position.x,y:b.plugin.py??b.position.y}, p1=b.position;
    for(const r of ropes){ if(r.cut||r.kind==='link') continue; const [A,B]=ropeEnds(r); if(segDist(p1,A,B)<6||segX(p0,p1,A,B)) cutRope(r); }
    b.plugin.px=p1.x; b.plugin.py=p1.y;

    if(Math.random()<.5){const a=Math.random()*Math.PI*2,r=rnd(60,150);particles.push({t:'glow',x:w.x+Math.cos(a)*r,y:w.y+Math.sin(a)*r,vx:-Math.sin(a)*120-Math.cos(a)*60,vy:Math.cos(a)*120-Math.sin(a)*60,r:rnd(1.5,3),c:Math.random()<.5?'#c69cff':'#ffb36b',life:0,max:.9,well:w});}
    for(const b of Composite.allBodies(world)){

      if(Math.hypot(b.position.x-w.x,b.position.y-w.y)<16){

        particles.push({t:'ring',x:w.x,y:w.y,vx:0,vy:0,r:50,life:0,max:.3,c:'#c69cff'}); sfx('warp');
      }
    }
  }
}
function fxPortal(e){

/* ---------------- FIRING ---------------- */
function totalAmmo(){return (ammo.grenade||0)+(ammo.rocket||0);}
function canFire(){return state==='play'&&player&&player.plugin.alive&&projectiles.length===0&&(ammo[weapon]||0)>0;}
function shoulder(){return wpt(player,{x:player.plugin.loc.torso.x+2,y:player.plugin.loc.torso.y-4});}
function tipPos(){const s=shoulder();return{x:s.x+aim.dx*44,y:s.y+aim.dy*44};}

function fire(){

function predict(){
  const pts=[]; const t=tipPos(), v=launchVel(); const g=weapon==='rocket'?GS*.2:GS;
  const all=Composite.allBodies(world).filter(b=>b!==player&&b.plugin.kind!=='balloon');
  let x=t.x,y=t.y,vx=v.x,vy=v.y,inP=portalAt(t),warps=0;
  for(let i=0;i<190;i++){
    if(wells.length){const a=wellAcc(x,y); vx+=a.x; vy+=a.y; if(wells.some(w=>Math.hypot(w.x-x,w.y-y)<16)) break;}
    vy+=g; x+=vx; y+=vy;
    const e=portals.length?portalAt({x,y}):null;
    if(e&&e!==inP&&warps<4){x=e.partner.x;y=e.partner.y;inP=e.partner;warps++;pts.push({x,y,w:warps,gap:true});}
    else if(!e) inP=null;
    if(i%3===2) pts.push({x,y,w:warps});

}

/* ---------------- SIM STEP ---------------- */
function step(){
  Engine.update(engine,DT); sim++;
  updateWorldTricks();
  for(const p of projectiles.slice()){
    if(p.plugin.ng&&sim>=p.plugin.ng){p.collisionFilter.group=0; p.plugin.ng=0;}
    if(p.plugin.kind==='grenade'&&sim>=p.plugin.fuse){removeProj(p); explode(p.position,R_GREN,P_GREN,p,'self'); continue;}
    if(p.plugin.kind==='rocket'&&!p.plugin.done){
      const a=Math.atan2(p.velocity.y,p.velocity.x);
      particles.push({t:'fire',x:p.position.x-Math.cos(a)*16,y:p.position.y-Math.sin(a)*16,vx:rnd(-20,20),vy:rnd(-20,20),r:rnd(4,6),life:0,max:.18});
      if(sim%2===0) particles.push({t:'smoke',x:p.position.x-Math.cos(a)*18,y:p.position.y-Math.sin(a)*18,vx:rnd(-15,15),vy:rnd(-30,0),r:rnd(4,7),life:0,max:rnd(.5,.9)});
      if(sim-p.plugin.born>500){removeProj(p);Composite.remove(world,p);continue;}
    }
    if(p.position.y>1600||p.position.x<-600||p.position.x>2200){removeProj(p);Composite.remove(world,p);}
  }
  for(const g of nades.slice()){
    if(sim>=g.plugin.fuse){nades=nades.filter(x=>x!==g); explode(g.position,R_GREN,P_GREN,g,'enemy');}
    else if(g.position.y>1600){nades=nades.filter(x=>x!==g); Composite.remove(world,g);}
  }
  for(const f of flames.slice()) if(sim-f.plugin.born>75||f.position.y>1600){flames=flames.filter(x=>x!==f);Composite.remove(world,f);
    particles.push({t:'smoke',x:f.position.x,y:f.position.y,vx:rnd(-20,20),vy:-40,r:8,life:0,max:.6});}
  // dragons swallow grenades that fly into an open mouth
  for(const e of enemies){
    if(!e.plugin.alive||!e.plugin.dragon) continue; const pl=e.plugin;
    pl.mouthOpen=pl.breath==='charge'||pl.breath==='fire';
    if(!pl.mouthOpen) continue;
    const m=wpt(e,pl.loc.mouth);
    for(const p of projectiles.slice()){
      if(p.plugin.kind!=='grenade') continue;
      if(Math.hypot(p.position.x-m.x,p.position.y-m.y)<30){
        removeProj(p); Composite.remove(world,p); pl.breath='gulp'; pl.mouthOpen=false; pl.gulp=sim; sfx('gulp');
        particles.push({t:'text',x:m.x,y:m.y-40,vx:0,vy:-60,life:0,max:1,text:'GULP!',c:'#fff'});
        later(40,()=>killDragon(e)); break;
      }
    }
  }
  for(const b of bullets.slice()) if(sim-b.plugin.born>150||b.position.y>1600||b.position.x<-400||b.position.x>2000){bullets=bullets.filter(x=>x!==b);Composite.remove(world,b);}
  for(const b of arrows.slice()) if(sim-b.plugin.born>300||b.position.y>1600){arrows=arrows.filter(x=>x!==b);Composite.remove(world,b);}
  for(const b of balloons.slice()) if(b.position.y<-900){balloons=balloons.filter(x=>x!==b);Composite.remove(world,b);}
  if(queue.length){const due=queue.filter(q=>q.at<=sim); queue=queue.filter(q=>q.at>sim); for(const q of due) q.fn();}
  for(const e of enemies){
    if(!e.plugin.alive) continue;
    if((!e.plugin.titan&&!e.plugin.dragon&&Math.abs(normA(e.angle))>.95)||e.position.y>1400||e.position.y<-700){ if(e.plugin.titan) killTitan(e,null); else if(e.plugin.dragon) killDragon(e); else kill(e); }
  }
  if(player.plugin.alive&&player.position.y>1300){ if(sim-(player.plugin.dmgAt||-999)>240) player.plugin.cause='fall'; killPlayer({x:0,y:0},false); }
  updateEnemies();
  for(const e of enemies) if(e.plugin.alive&&e.plugin.jet&&sim%2===0){
    const pk=wpt(e,{x:e.plugin.loc.extra.x,y:e.plugin.loc.extra.y+14});
    particles.push({t:'fire',x:pk.x,y:pk.y,vx:rnd(-15,15),vy:rnd(120,200),r:rnd(4,6),life:0,max:.15});
  }
  if(sim%3===0){
    for(const r of rags){
      if(r.plugin.bleed<=sim||!inWorld(r)) continue;
      const sp=Math.hypot(r.velocity.x,r.velocity.y);
      if(sp<.3&&Math.random()<.6) continue;
      blood(r.position.x,r.position.y,r.velocity.x*40+rnd(-50,50),r.velocity.y*40+rnd(-80,10),rnd(1.8,3.2),r.plugin.col);
    }
  }
  let moving=false;
  for(const b of Composite.allBodies(world)){
    if(b.isStatic) continue;
    if(b.speed>.35&&b.plugin.kind!=='balloon'&&b.plugin.kind!=='flame'&&!(b.plugin.kind==='enemy'&&(b.plugin.jet||b.plugin.dragon))) moving=true;
    if(b.position.y>2600) Composite.remove(world,b);
  }
  if(moving) lastMove=sim;
  checkEnd();
}
function aliveCount(){return enemies.filter(e=>e.plugin.alive).length;}
function checkEnd(){
  if(state!=='play') return;
  if(aliveCount()===0){
    state='won'; slowUntil=performance.now()+1100; setTimeout(showWin,1700);
  } else if(totalAmmo()===0&&projectiles.length===0&&queue.length===0&&sim-lastShot>90&&(sim-lastMove>45||sim-lastShot>600)){
    state='lost'; loseWhy='ammo'; setTimeout(showLose,500);
  }
}

function addDecal(d){decals.push(d); if(decals.length>260) decals.splice(0,decals.length-260);}
function fxExplosion(p,R,power){
  particles.push({t:'flash',x:p.x,y:p.y,vx:0,vy:0,r:R*.55,life:0,max:.16});

  for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=rnd(30,150);particles.push({t:'smoke',x:p.x+rnd(-15,15),y:p.y+rnd(-15,15),vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,r:rnd(12,26),life:0,max:rnd(1,1.8),drag:1.5});}
  for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=rnd(250,620);particles.push({t:'spark',x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,g:900,life:0,max:rnd(.25,.6)});}

function updParticles(dt){
  for(const p of particles){
    p.life+=dt;
    if(p.well){const dx=p.well.x-p.x,dy=p.well.y-p.y,r=Math.hypot(dx,dy)||1; p.vx+=dx/r*600*dt; p.vy+=dy/r*600*dt; if(r<14) p.life=p.max;}
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.g) p.vy+=p.g*dt;
    if(p.drag){const d=Math.max(0,1-p.drag*dt); p.vx*=d; p.vy*=d;}
    if(p.spin) p.a=(p.a||0)+p.spin*dt;
    if(p.t==='blood'&&statics.length&&Query.point(statics,p).length){
      addDecal({t:'blood',x:p.x,y:p.y,r:p.r*rnd(1.3,2.6),sx:1+Math.min(1.5,Math.abs(p.vx)/300),a:Math.atan2(p.vy,p.vx)*.15,dots:[[rnd(-8,8),rnd(-3,3),rnd(.8,2)],[rnd(-10,10),rnd(-3,3),rnd(.6,1.6)]]});
      p.life=p.max;
    }
  }
  particles=particles.filter(p=>p.life<p.max);
  if(particles.length>900) particles.splice(0,particles.length-900);
}

/* ---------------- SOUND & MUSIC ---------------- */
let AC=null, muted=false, lastSfx={}, sfxBus=null;
function audioInit(){
  if(AC){if(AC.state==='suspended') AC.resume(); musicStart(); return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)(); sfxBus=AC.createGain(); sfxBus.gain.value=1; sfxBus.connect(AC.destination);}catch(e){AC=null;}
  musicStart();
}
function nz(dur,vol,type,freq,decay){
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(sfxBus); s.start();
}
function tone(f0,f1,dur,vol,type){
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(sfxBus); o.start(t); o.stop(t+dur);
}
function sfx(k,v){
  if(!AC||muted) return; v=v==null?1:v;
  const now=performance.now(); if(lastSfx[k]&&now-lastSfx[k]<40) return; lastSfx[k]=now;
  try{
    if(k==='boom'){nz(1.1,.8*v,'lowpass',700,3); tone(95,35,.6,.7*v);}
    else if(k==='launch'){nz(.3,.35,'bandpass',1400,2); tone(320,120,.15,.2);}
    else if(k==='clink'){tone(1300,800,.06,.07*v,'triangle');}
    else if(k==='pop'){tone(540,170,.16,.18);}
    else if(k==='splat'){nz(.35,.5,'lowpass',500,2); tone(200,60,.25,.3);}
    else if(k==='hurt'){tone(260,140,.2,.25,'square'); nz(.12,.3,'lowpass',900,2);}
    else if(k==='shot'){nz(.14,.35,'highpass',1200,4); tone(180,70,.08,.2);}
    else if(k==='ric'){tone(2400,900,.12,.05,'triangle');}
    else if(k==='alert'){tone(880,1200,.12,.08,'square');}
    else if(k==='warp'){tone(200,1400,.25,.12,'sawtooth'); tone(1400,300,.3,.08,'sine');}
    else if(k==='bow'){tone(160,90,.12,.15,'triangle'); nz(.1,.15,'highpass',2500,3);}
    else if(k==='thunk'){tone(220,90,.08,.2,'triangle');}
    else if(k==='swing'){nz(.2,.25,'bandpass',2200,1.5);}
    else if(k==='clang'){tone(1800,1500,.25,.1,'square'); tone(2700,2400,.2,.06,'triangle');}
    else if(k==='jump'){tone(200,380,.12,.1,'triangle');}
    else if(k==='toss'){nz(.15,.2,'bandpass',1800,2);}
    else if(k==='snap'){nz(.08,.4,'highpass',3000,3); tone(600,200,.08,.12,'triangle');}
    else if(k==='balloon'){nz(.07,.6,'highpass',1500,4);}
    else if(k==='roar'){nz(.9,.45,'lowpass',500,1.2); tone(140,70,.8,.25,'sawtooth');}
    else if(k==='fire'){nz(.3,.25,'bandpass',900,1.5);}
    else if(k==='gulp'){tone(400,90,.25,.3,'sine'); tone(200,60,.3,.2,'triangle');}
    else if(k==='stomp'){tone(70,35,.25,.4,'sine'); nz(.15,.2,'lowpass',300,2);}
    else if(k==='smash'){nz(.5,.7,'lowpass',400,2); tone(90,30,.4,.5,'sine');}
    else if(k==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>{try{tone(f,f*1.01,.2,.15,'triangle')}catch(e){}},i*110));}
    else if(k==='lose'){tone(330,110,.55,.15,'triangle');}
  }catch(e){}
}
/* Light, upbeat game music (C - G - Am - F), kept quiet so it never gets in the way. It ducks under explosions. */
const MU={timer:null,master:null,delay:null,noise:null,next:0,step:0,vol:.42};
const mf=n=>440*Math.pow(2,(n-69)/12);
const CHORDS=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];
const MEL=[
  [[0,72],[3,76],[6,79],[8,76],[10,74],[12,72]],
  [[0,71],[3,74],[6,79],[10,74],[12,71],[14,67]],
  [[0,72],[3,76],[6,81],[8,79],[10,76],[12,72]],
  [[0,77],[2,76],[4,72],[8,69],[12,72]],
  [[0,79],[2,76],[4,72],[6,76],[8,79],[12,84]],
  [[0,83],[4,79],[6,74],[8,79],[10,83]],
  [[0,81],[2,79],[4,76],[8,72],[10,76]],
  [[0,77],[4,72],[6,69],[8,72],[12,74]]
];
function musicStart(){
  if(!AC||MU.timer||!prog.music) return;
  MU.master=AC.createGain(); MU.master.gain.value=0; MU.master.connect(AC.destination);
  MU.master.gain.setTargetAtTime(muted?0:MU.vol,AC.currentTime,.6);
  MU.delay=AC.createDelay(1); MU.delay.delayTime.value=60/112*.75;
  const fb=AC.createGain(); fb.gain.value=.25; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2500;
  const wet=AC.createGain(); wet.gain.value=.35;
  MU.delay.connect(lp).connect(fb).connect(MU.delay); lp.connect(wet).connect(MU.master);
  const n=Math.floor(AC.sampleRate*.08); MU.noise=AC.createBuffer(1,n,AC.sampleRate); const d=MU.noise.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  MU.next=AC.currentTime+.1; MU.step=0;
  MU.timer=setInterval(musicTick,60);
}
function musicStop(){
  if(!MU.timer) return; clearInterval(MU.timer); MU.timer=null;
  const m=MU.master; try{m.gain.setTargetAtTime(0,AC.currentTime,.2); setTimeout(()=>m.disconnect(),1200);}catch(e){}
}
function musicDuck(){ if(!MU.timer||muted) return; const g=MU.master.gain,t=AC.currentTime; g.cancelScheduledValues(t); g.setTargetAtTime(MU.vol*.4,t,.03); g.setTargetAtTime(MU.vol,t+.4,.6); }
function musicTick(){
  if(!AC) return; const S=60/112/4;
  while(MU.next<AC.currentTime+.3){ musicStep(MU.step,MU.next); MU.next+=S; MU.step++; }
}
function mv(type,freq,t,dur,vol,cut,send){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type; o.frequency.value=freq; f.type='lowpass'; f.frequency.value=cut;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(f).connect(g).connect(MU.master); if(send) g.connect(MU.delay);
  o.start(t); o.stop(t+dur+.05);
}
function musicStep(s,t){
  const bar=Math.floor(s/16), pos=s%16, ch=CHORDS[bar%4], bright=theme==='sky'?1.3:1;
  // soft kick and shaker
  if(pos===0||pos===8){const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(48,t+.12);
    g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.16); o.connect(g).connect(MU.master); o.start(t); o.stop(t+.2);}
  if(pos%2===0){const b=AC.createBufferSource(); b.buffer=MU.noise; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
    const g=AC.createGain(); g.gain.value=pos%4===2?.05:.025; b.connect(f).connect(g).connect(MU.master); b.start(t);}
  // bouncy bass
  const bassPat={0:0,3:0,6:12,8:7,11:0,14:12};
  if(pos in bassPat) mv('triangle',mf(ch[0]-24+bassPat[pos]),t,.22,.13,700);
  // light chiptune arpeggio on off-beats
  if(pos%2===1) mv('square',mf(ch[(pos>>1)%3]+12),t,.09,.018,1400*bright);
  // marimba melody; every other 8-bar section rests so it never gets tiring
  const sec=Math.floor(bar/8)%4;
  if(sec!==3){
    const ph=MEL[bar%8]; for(const [st,n] of ph) if(st===pos){
      const tr=sec===1?12:0;
      mv('sine',mf(n+tr),t,.42,.075,4000,true); mv('sine',mf(n+tr)*4,t,.06,.012,8000);
    }
  }
}

/* ---------------- DRAWING ---------------- */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function drawCloud(x,y,s){
  const R=30*s;
  ctx.fillStyle='rgba(176,198,226,.55)';
  for(const c of [[0,.35,1],[-1,.5,.7],[1,.5,.75]]){circ(x+c[0]*R,y+c[1]*R,c[2]*R);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.95)';
  for(const c of [[0,0,1],[-.95,.25,.7],[.95,.25,.75],[-.4,-.35,.75],[.45,-.3,.7]]){circ(x+c[0]*R,y+c[1]*R,c[2]*R);ctx.fill();}
}
function drawBG(dt){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(theme==='sky'){g.addColorStop(0,'#5c9be0');g.addColorStop(.55,'#a9cff0');g.addColorStop(1,'#e8f2fb');}
  else{g.addColorStop(0,'#74cbe2');g.addColorStop(.62,'#bfe9ee');g.addColorStop(1,'#f6e9c9');}
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const sg=ctx.createRadialGradient(W*.82,H*.14,0,W*.82,H*.14,90);
  sg.addColorStop(0,'rgba(255,250,215,.95)');sg.addColorStop(.25,'rgba(255,244,190,.7)');sg.addColorStop(1,'rgba(255,244,190,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  for(const c of clouds){
    c.x+=c.v*dt; if(c.x>1.15) c.x=-.15;
    drawCloud(c.x*W,c.y*H,c.s*(theme==='sky'?1.3:.9));
  }
  const hy=cam.oy+640*cam.s;
  if(theme==='sky'){
    for(let i=0;i<9;i++){const x=((i*0.13+0.02)%1)*W*1.1-20;drawCloud(x,hy+40+(i%3)*28,1.6+(i%2)*.5);}
  } else {
    ctx.fillStyle='#efd9a6';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W+20;x+=20) ctx.lineTo(x,hy-40-22*Math.sin(x*.006+1)-10*Math.sin(x*.019));
    ctx.lineTo(W,H);ctx.fill();
    ctx.fillStyle='#e9cd92';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W+20;x+=20) ctx.lineTo(x,hy-12-14*Math.sin(x*.009+3)-6*Math.sin(x*.03));
    ctx.lineTo(W,H);ctx.fill();
  }
}
function staticPath(b){const v=b.vertices;ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();}
function drawStatic(b){
  if(b.plugin.kind==='pad') return drawPad(b);
  const v=b.vertices;
  ctx.beginPath();staticPath(b);
  const top=Math.min(v[0].y,v[1].y);
  const g=ctx.createLinearGradient(0,top,0,top+320);
  if(theme==='sky'){g.addColorStop(0,'#e4bd77');g.addColorStop(1,'#b98a45');}
  else{g.addColorStop(0,'#ecc27a');g.addColorStop(1,'#c99348');}
  ctx.fillStyle=g;ctx.fill();
  if(b.plugin.cr&&b.plugin.cr.length){
    ctx.save();ctx.clip();
    ctx.strokeStyle=theme==='sky'?'rgba(95,60,20,.45)':'rgba(120,80,30,.22)';ctx.lineWidth=theme==='sky'?1.6:1.2;ctx.lineJoin='round';
    for(const c of b.plugin.cr){ctx.beginPath();ctx.moveTo(c[0][0],c[0][1]);for(let i=1;i<c.length;i++)ctx.lineTo(c[i][0],c[i][1]);ctx.stroke();}
    ctx.restore();
  }
  ctx.strokeStyle='rgba(120,78,28,.45)';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='#f8dc9e';ctx.lineWidth=6;ctx.lineCap='round';line(v[0].x,v[0].y+2,v[1].x,v[1].y+2);
}
function drawPad(b){
  const {w,h}=b.plugin;
  ctx.save();ctx.translate(b.position.x,b.position.y);
  rr(-w/2,-h/2,w,h,6);ctx.fillStyle='#ff5a6e';ctx.fill();
  ctx.save();ctx.clip();ctx.fillStyle='#fff';
  for(let y=-h/2-w;y<h/2;y+=26){ctx.beginPath();ctx.moveTo(-w/2,y);ctx.lineTo(w/2,y+w);ctx.lineTo(w/2,y+w+12);ctx.lineTo(-w/2,y+12);ctx.fill();}
  ctx.restore();
  rr(-w/2,-h/2,w,h,6);ctx.strokeStyle='#b8243a';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}
function drawDecals(){
  if(!decals.length) return;
  ctx.save();
  ctx.beginPath(); for(const b of statics) if(b.plugin.kind!=='pad') staticPath(b); ctx.clip();
  for(const d of decals){
    if(d.t==='scorch'){
      const g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      g.addColorStop(0,'rgba(35,22,12,.6)');g.addColorStop(.6,'rgba(50,30,15,.3)');g.addColorStop(1,'rgba(50,30,15,0)');
      ctx.fillStyle=g;ctx.fillRect(d.x-d.r,d.y-d.r,d.r*2,d.r*2);
    } else {

      ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(8+22*Math.cos(-1.2),22*Math.sin(-1.2));ctx.lineTo(8-pull,0);ctx.lineTo(8+22*Math.cos(1.2),22*Math.sin(1.2));ctx.stroke();
      if(pull){ctx.strokeStyle='#7a5530';ctx.lineWidth=2;line(8-pull,0,36-pull,0);}
      ctx.strokeStyle=col[1];ctx.lineWidth=7;ctx.lineCap='round';line(-4,0,16,0);
    } else {
      ctx.strokeStyle=col[1];ctx.lineWidth=7;ctx.lineCap='round';line(-4,0,16,0);
      if(pl.lob){circ(20,0,6);ctx.fillStyle='#4f9a3a';ctx.fill();}
    }
    ctx.restore();
  }
  if(pl.alertAt&&sim-pl.alertAt<70){
    const Hw=wpt(e,{x:Hd.x,y:Hd.y-30});
    ctx.fillStyle='#ff3b4e';rr(Hw.x-9,Hw.y-14,18,24,6);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='20px "Lilita One",sans-serif';ctx.textAlign='center';ctx.fillText('!',Hw.x,Hw.y+5);
  }
}
function drawRag(b){
  const {shape,w,h,col}=b.plugin;
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  if(shape==='head'){const R=b.plugin.r||13;circ(0,0,R);ctx.fillStyle=headGrad(0,0,R,col[2],col[0]);ctx.fill();}
  else{
    const th=Math.min(w,h);ctx.lineCap='round';ctx.lineWidth=th;ctx.strokeStyle=shape==='torso'?col[0]:col[1];
    if(h>=w) line(0,-h/2+th/2,0,h/2-th/2); else line(-w/2+th/2,0,w/2-th/2,0);
    if(prog.blood&&b.plugin.bleed>sim-600){ctx.fillStyle='#a3101f';circ(0,-h/2+th/2,th*.32);ctx.fill();}
  }
  ctx.restore();
}
function drawGrenade(b,enemy){
  if(enemy){const k=1-(b.plugin.fuse-sim)/110; ctx.setLineDash([8,8]);circ(b.position.x,b.position.y,R_GREN*.75);ctx.strokeStyle=`rgba(255,60,60,${.25+.45*k})`;ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);}
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  const left=b.plugin.fuse-sim;
  if(left<50&&Math.floor(sim/5)%2){circ(0,0,15);ctx.fillStyle='rgba(255,70,40,.45)';ctx.fill();}
  ctx.fillStyle='#7a7f8c';ctx.fillRect(-3,-13,6,5);
  circ(0,0,9);ctx.fillStyle=enemy?headGrad(0,0,9,'#9aa0aa','#4a4f5a'):headGrad(0,0,9,'#8fd16f','#3f7f2c');ctx.fill();
  ctx.strokeStyle=enemy?'#2e323a':'#2f6323';ctx.lineWidth=1.2;line(-8,-2,8,-2);line(-8,3,8,3);line(0,-9,0,9);
  ctx.restore();
}
function drawRocket(b){
  const a=Math.atan2(b.velocity.y,b.velocity.x);
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(a);
  ctx.fillStyle='#2f4d1d';ctx.beginPath();ctx.moveTo(-15,-5);ctx.lineTo(-20,-10);ctx.lineTo(-9,-5);ctx.moveTo(-15,5);ctx.lineTo(-20,10);ctx.lineTo(-9,5);ctx.fill();
  rr(-15,-5,30,10,4);ctx.fillStyle='#5a8c40';ctx.fill();
  ctx.fillStyle='#e2402b';ctx.beginPath();ctx.moveTo(14,-5);ctx.lineTo(22,0);ctx.lineTo(14,5);ctx.fill();
  ctx.restore();
}
function drawArrowShape(x,y,a,len){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.strokeStyle='#7a5530';ctx.lineWidth=2;ctx.lineCap='round';line(-len,0,0,0);
  ctx.fillStyle='#9aa3b5';ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo(7,0);ctx.lineTo(0,3);ctx.fill();
  ctx.fillStyle='#e8e2d4';ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(-len-5,-4);ctx.lineTo(-len+5,0);ctx.lineTo(-len-5,4);ctx.fill();
  ctx.restore();
}
function drawBullet(b){
  const v=b.velocity;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,226,122,.35)';ctx.lineWidth=7;line(b.position.x-v.x*1.6,b.position.y-v.y*1.6,b.position.x,b.position.y);
  ctx.strokeStyle='#fff3b0';ctx.lineWidth=3;line(b.position.x-v.x*1.1,b.position.y-v.y*1.1,b.position.x,b.position.y);
}
function drawStuck(){
  for(const s of stuck){
    if(s.body){ if(!inWorld(s.body)) continue; const p=wpt(s.body,{x:s.lx,y:s.ly}); drawArrowShape(p.x-Math.cos(s.la+s.body.angle)*7,p.y-Math.sin(s.la+s.body.angle)*7,s.la+s.body.angle,20); }
    else drawArrowShape(s.x-Math.cos(s.a)*7,s.y-Math.sin(s.a)*7,s.a,20);
  }
}
function drawPlayer(){
  if(!player.plugin.alive) return;
  const L=player.plugin.loc,T=L.torso,Hd=L.head,F=L.feet, ang=Math.atan2(aim.dy,aim.dx), S=shoulder();
  const fl=sim<player.plugin.flash;
  const B=fl?'#ffffff':'#3b6cff',BD=fl?'#ffd0d0':'#2a4fd0';
  ctx.save();ctx.translate(player.position.x,player.position.y);
  ctx.lineCap='round';ctx.strokeStyle=BD;ctx.lineWidth=10;
  line(T.x-6,T.y+12,F.x-9,F.y+2);line(T.x+6,T.y+12,F.x+9,F.y+2);
  rr(T.x-13,T.y-16,26,32,11);ctx.fillStyle=B;ctx.fill();
  circ(Hd.x,Hd.y,13);ctx.fillStyle=fl?'#fff':headGrad(Hd.x,Hd.y,13,'#8fb0ff',B);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(S.x,S.y);ctx.rotate(ang);ctx.translate(-recoil*7,0);
  rr(-18,-7,58,14,5);ctx.fillStyle='#5a8c40';ctx.fill();ctx.strokeStyle='#2f4d1d';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#2f4d1d';ctx.fillRect(36,-9,7,18);ctx.fillRect(-20,-8,5,16);ctx.fillRect(4,6,6,8);
  ctx.restore();
  const hnd=rot({x:10-recoil*7,y:6},ang), sh=wpt(player,{x:T.x+3,y:T.y-10});
  ctx.strokeStyle=BD;ctx.lineWidth=8;line(sh.x,sh.y,S.x+hnd.x,S.y+hnd.y);
  const hp=player.plugin.hp/100, hb=wpt(player,{x:Hd.x,y:Hd.y-24});
  ctx.fillStyle='rgba(42,33,64,.55)';rr(hb.x-22,hb.y-4,44,8,4);ctx.fill();
  ctx.fillStyle=hp>.5?'#3fc46a':hp>.25?'#ffb020':'#ff3b4e';rr(hb.x-21,hb.y-3,42*hp,6,3);ctx.fill();
}
function drawParticles(){
  for(const p of particles){
    const k=p.life/p.max;
    if(p.t==='flash'){ctx.globalAlpha=1-k;circ(p.x,p.y,p.r*(.6+k*.6));ctx.fillStyle='#fff6c8';ctx.fill();}
    else if(p.t==='ring'){ctx.globalAlpha=(1-k)*.8;circ(p.x,p.y,p.r*k);ctx.strokeStyle=p.c||'#fff';ctx.lineWidth=7*(1-k)+1;ctx.stroke();}
    else if(p.t==='fire'){ctx.globalAlpha=1-k;circ(p.x,p.y,p.r*(1+k*.8));ctx.fillStyle=k<.3?'#fff2a0':k<.6?'#ffab3b':'#e2552a';ctx.fill();}
    else if(p.t==='smoke'){ctx.globalAlpha=(1-k)*.55;circ(p.x,p.y,p.r*(1+k*1.5));ctx.fillStyle=k<.15?'#6d655a':'#a49d90';ctx.fill();}
    else if(p.t==='puff'){ctx.globalAlpha=(1-k);circ(p.x,p.y,p.r*(1+k));ctx.fillStyle='#fff';ctx.fill();}
    else if(p.t==='chunk'||p.t==='splinter'){
      ctx.globalAlpha=1-k*k;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a||0);
      if(p.t==='splinter')ctx.fillRect(-p.s/2,-1.5,p.s,3);else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore();}
    else if(p.t==='spark'){ctx.globalAlpha=1-k;ctx.strokeStyle=k<.5?'#fff5c0':'#ffae3b';ctx.lineWidth=2.5;ctx.lineCap='round';line(p.x,p.y,p.x-p.vx*.03,p.y-p.vy*.03);}
    else if(p.t==='ember'){ctx.globalAlpha=(1-k)*(.6+.4*Math.sin(p.life*30));circ(p.x,p.y,p.r);ctx.fillStyle='#ff9a2e';ctx.fill();}
    else if(p.t==='blood'){ctx.globalAlpha=1;circ(p.x,p.y,p.r);ctx.fillStyle='#b3121f';ctx.fill();}
    else if(p.t==='mist'){ctx.globalAlpha=(1-k)*.45;circ(p.x,p.y,p.r*(1+k));ctx.fillStyle='#c4202f';ctx.fill();}
    else if(p.t==='glow'){ctx.globalAlpha=1-k;circ(p.x,p.y,p.r);ctx.fillStyle=p.c;ctx.fill();}
    else if(p.t==='text'){ctx.globalAlpha=k<.7?1:(1-k)/.3;ctx.font='34px "Lilita One",sans-serif';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#2a2140';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.text,p.x,p.y);}
  }
  ctx.globalAlpha=1;
}

function layout(){
  const v=LEVELS[levelIdx].view;
  const top=$('hud').getBoundingClientRect().bottom||60;
  const bot=H-($('wbar').getBoundingClientRect().top||H-90);
  const aw=W-12, ah=Math.max(120,H-top-bot-8);
  const s=Math.min(aw/v[2],ah/v[3]);
  cam.s=s; cam.ox=(W-v[2]*s)/2-v[0]*s; cam.oy=top+(ah-v[3]*s)/2-v[1]*s+4;
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout(); drawBG(dt);
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
  ctx.save();ctx.translate(cam.ox+sx,cam.oy+sy);ctx.scale(cam.s,cam.s);
  const all=Composite.allBodies(world), t=performance.now()/1000;
  for(const w of wells) drawWell(w,t);
  for(const e of portals) drawPortal(e,t);
  for(const b of statics) drawStatic(b);
  drawDecals();
  drawRopes();
  for(const b of all){const k=b.plugin.kind;
    if(k==='block')drawBlock(b);else if(k==='boulder')drawBoulder(b);else if(k==='barrel')drawBarrel(b);else if(k==='rag')drawRag(b);else if(k==='balloon')drawBalloon(b);}
  drawStuck();
  for(const b of all){const k=b.plugin.kind;
    if(k==='enemy')drawEnemy(b);else if(k==='grenade')drawGrenade(b,false);else if(k==='nade')drawGrenade(b,true);else if(k==='rocket')drawRocket(b);
    else if(k==='bullet')drawBullet(b);else if(k==='flame')drawFlame(b);else if(k==='arrow')drawArrowShape(b.position.x+Math.cos(Math.atan2(b.velocity.y,b.velocity.x))*13,b.position.y+Math.sin(Math.atan2(b.velocity.y,b.velocity.x))*13,Math.atan2(b.velocity.y,b.velocity.x),26);}
  drawPlayer();
  drawParticles();
  if(drag&&aim.active&&canFire()){
    const pts=predict(), r0=4.5/cam.s;
    pts.forEach((p,i)=>{if(p.gap)return;circ(p.x,p.y,Math.max(r0*.45,r0*(1-i*.012)));ctx.fillStyle=p.w?'#7dffa2':'rgba(255,255,255,.95)';ctx.fill();ctx.strokeStyle='rgba(42,33,64,.55)';ctx.lineWidth=1.5/cam.s;ctx.stroke();});
  }
  ctx.restore();
  if(flashA>0){ctx.fillStyle=`rgba(255,248,220,${flashA})`;ctx.fillRect(0,0,W,H);}
  if(hurtA>0){
    const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
    g.addColorStop(0,'rgba(220,20,40,0)');g.addColorStop(1,`rgba(220,20,40,${hurtA})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(drag&&aim.active){
    ctx.lineCap='round';
    circ(drag.x0,drag.y0,24);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.stroke();
    ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;line(drag.x0,drag.y0,drag.x,drag.y);ctx.setLineDash([]);
    circ(drag.x,drag.y,10);ctx.fillStyle=aim.pow>.95?'#ff6a3d':'#fff';ctx.fill();
  }
}

/* ---------------- LOOP ---------------- */
let lastT=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  const ts=now<slowUntil?.35:1;
  if(engine){acc+=dt*1000*ts; let n=0; while(acc>=DT&&n<4){step();acc-=DT;n++;} if(n>=4)acc=0;}
  updParticles(dt*ts);
  shake*=Math.pow(.004,dt); if(shake<.2)shake=0;
  recoil=Math.max(0,recoil-dt*5);
  flashA=Math.max(0,flashA-dt*2.5);
  hurtA=Math.max(player&&!player.plugin.alive?.35:0,hurtA-dt*1.2);
  render(dt);
  requestAnimationFrame(frame);
}

/* ---------------- INPUT ---------------- */
function updAim(){
  const dx=drag.x0-drag.x, dy=drag.y0-drag.y, len=Math.hypot(dx,dy);
  if(len<12){aim.active=false;return;}
  aim.dx=dx/len; aim.dy=dy/len; aim.pow=Math.min(1,len/(Math.min(W,H)*.32)); aim.active=true;
}
cv.addEventListener('pointerdown',e=>{
  audioInit(); if(state!=='play') return;
  drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; drag.x=e.clientX; drag.y=e.clientY; updAim(); });
cv.addEventListener('pointerup',e=>{ if(!drag||e.pointerId!==drag.id) return; if(aim.active) fire(); drag=null; aim.active=false; });
cv.addEventListener('pointercancel',()=>{drag=null;aim.active=false;});
document.addEventListener('visibilitychange',()=>{ if(!AC) return; if(document.hidden) AC.suspend(); else AC.resume(); });

/* ---------------- UI ---------------- */
function updateHUD(){
  $('lvl').textContent='Level '+(levelIdx+1);
  $('foes').textContent=aliveCount();
  const hp=player?player.plugin.hp:100, bar=$('hpBar');
  bar.style.width=hp+'%'; bar.style.background=hp>50?'#3fc46a':hp>25?'#ffb020':'#ff3b4e';
  for(const [id,w] of [['wG','grenade'],['wR','rocket']]){
    const btn=$(id), has=(LEVELS[levelIdx].ammo[w]||0)>0;
    btn.classList.toggle('hidden',!has);
    btn.querySelector('b').textContent='×'+(ammo[w]||0);
    btn.classList.toggle('sel',weapon===w&&ammo[w]>0);
    btn.disabled=(ammo[w]||0)===0;
  }
}
function showOv(id){for(const o of ['ovTitle','ovLevels','ovResult']) $(o).classList.toggle('hidden',o!==id);}
function renderLevels(){
  const g=$('grid'); g.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button'); const open=i<prog.unlocked; const s=prog.stars[i]||0;
    b.className='lv'+(open?'':' lock');
    b.innerHTML=open?`${i+1}<small>${'★'.repeat(s)}${'☆'.repeat(3-s)}</small>`:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
    b.setAttribute('aria-label',open?`Level ${i+1}, ${L.name}`:`Level ${i+1}, locked`);
    if(open) b.onclick=()=>startLevel(i); else b.disabled=true;
    g.appendChild(b);
  });
  showOv('ovLevels');
}
function startLevel(i){
  audioInit(); build(i); state='play'; showOv(null);
  const h=LEVELS[i].hint; $('hint').textContent=h||''; $('hint').classList.toggle('hidden',!h);
}
function starsHTML(n){let s='';for(let i=0;i<3;i++)s+=`<span class="${i<n?'on':'off'}">★</span>`;return s;}
function showWin(){
  if(state!=='won') return;
  const L=LEVELS[levelIdx], n=shots<=L.par?3:shots<=L.par+1?2:1;
  prog.stars[levelIdx]=Math.max(prog.stars[levelIdx]||0,n);
  prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,levelIdx+2)); saveProg();
  const last=levelIdx===LEVELS.length-1;
  $('resCard').innerHTML=`<h2 class="disp">${last?'All clear!':'Level cleared'}</h2>
    <div class="stars">${starsHTML(n)}</div>
    <p class="muted">${L.name}: ${shots} shot${shots===1?'':'s'} (par ${L.par}), ${player.plugin.hp} health left</p>
    <div class="row"><button class="btn ghost" id="rRetry">Retry</button>
    <button class="btn" id="rNext">${last?'Levels':'Next level'}</button></div>`;
  $('rRetry').onclick=()=>startLevel(levelIdx);
  $('rNext').onclick=()=>last?renderLevels():startLevel(levelIdx+1);
  showOv('ovResult'); sfx('win');
}
function showLose(){
  if(state!=='lost') return;
  const n=aliveCount();
  const ko=loseWhy==='ko', c=CAUSES[player.plugin.cause]||CAUSES.crush;
  $('resCard').innerHTML=`<h2 class="disp">${ko?c[0]:'Out of ammo'}</h2>
    <p class="muted">${ko?c[1]:`${n} enem${n===1?'y':'ies'} still standing. Try a different angle or weapon.`}</p>
    <div class="row"><button class="btn ghost" id="rLv">Levels</button>
    <button class="btn alt" id="rRetry">Try again</button></div>`;
  $('rRetry').onclick=()=>startLevel(levelIdx);
  $('rLv').onclick=()=>renderLevels();
  showOv('ovResult'); sfx('lose');
}
function toggleLabels(){$('tBlood').textContent='Blood: '+(prog.blood?'on':'off');$('tMusic').textContent='Music: '+(prog.music?'on':'off');}
$('tBlood').onclick=()=>{prog.blood=!prog.blood;saveProg();toggleLabels();};
$('tMusic').onclick=()=>{prog.music=!prog.music;saveProg();toggleLabels(); audioInit(); if(!prog.music) musicStop();};
toggleLabels();
$('tPlay').onclick=()=>startLevel(Math.min(prog.unlocked-1,LEVELS.length-1));
$('tLevels').onclick=()=>{audioInit();renderLevels();};
$('lBack').onclick=()=>showOv('ovTitle');
$('bMenu').onclick=()=>{state='menu';drag=null;renderLevels();};
$('bRetry').onclick=()=>startLevel(levelIdx);
$('bSound').onclick=()=>{
  muted=!muted;$('sOn').classList.toggle('hidden',muted);$('sOff').classList.toggle('hidden',!muted);audioInit();
  if(MU.master&&AC) MU.master.gain.setTargetAtTime(muted?0:MU.vol,AC.currentTime,.2);
};
$('wG').onclick=()=>{if(ammo.grenade>0){weapon='grenade';updateHUD();}};
$('wR').onclick=()=>{if(ammo.rocket>0){weapon='rocket';updateHUD();}};
window.addEventListener('keydown',e=>{if(e.key==='r'&&state!=='menu')startLevel(levelIdx);});

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
window.addEventListener('resize',resize);
resize();
build(0); state='menu'; showOv('ovTitle');
requestAnimationFrame(frame);
window.__dbg={build,step,fire,startLevel,get enemies(){return enemies;},get player(){return player;},get state(){return state;},
  setAim(dx,dy,p,w){aim.dx=dx;aim.dy=dy;aim.pow=p;weapon=w;}, alive:aliveCount, levels:LEVELS, predict, get bullets(){return bullets;},
  get ropes(){return ropes;}, get balloons(){return balloons;}};
</script>
